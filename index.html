<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 70px;
      padding: 30px;
    }

    .intro {
      width: 430px;
    }

    .logo {
      color: #1877f2;
      font-size: 56px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .intro p {
      font-size: 25px;
      line-height: 1.3;
      color: #1c1e21;
    }

    .login-box {
      width: 396px;
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #dddfe2;
      border-radius: 6px;
      margin-bottom: 12px;
      padding: 0 16px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px #e7f3ff;
    }

    .login {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 6px;
      background: #1877f2;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .login:hover {
      background: #166fe5;
    }

    .forgot {
      display: block;
      text-align: center;
      color: #1877f2;
      text-decoration: none;
      margin: 16px 0;
      font-size: 14px;
    }

    .line {
      border-top: 1px solid #dadde1;
      margin: 18px 0;
    }

    .create {
      display: block;
      margin: auto;
      background: #42b72a;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 14px 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .create:hover {
      background: #36a420;
    }

    .message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    @media (max-width: 750px) {
      .container {
        flex-direction: column;
        gap: 25px;
      }

      .intro {
        width: 100%;
        text-align: center;
      }

      .intro p {
        font-size: 19px;
      }

      .logo {
        font-size: 48px;
      }

      .login-box {
        width: 100%;
        max-width: 396px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="intro">
      <div class="logo">Social</div>
      <p>
        تواصل مع أصدقائك والعائلة وشارك ما يهمك.
      </p>
    </div>

    <div class="login-box">

      <form id="loginForm">

        <input
          type="text"
          id="email"
          placeholder="البريد الإلكتروني أو رقم الهاتف"
          autocomplete="off"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="كلمة السر"
          autocomplete="off"
          required
        >

        <button type="submit" class="login">
          تسجيل الدخول
        </button>

      </form>

      <a href="#" class="forgot">
        هل نسيت كلمة السر؟
      </a>

      <div class="line"></div>

      <button class="create">
        إنشاء حساب جديد
      </button>

      <div class="message" id="message"></div>

    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
    });
  </script>

</body>
</html>
